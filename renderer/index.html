<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Bot WhatsApp</title>
<style>
  :root {
    --bg: #edf0f3; --surface: #ffffff; --ink: #1c2530; --muted: #5d6b7a;
    --line: #d5dbe2; --accent: #1d6b73; --accent-ink: #ffffff; --danger: #a8402f;
    --field: #f7f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d; --surface: #1b222b; --ink: #e6ebf0; --muted: #93a1b0;
      --line: #2c3743; --accent: #4fb3bd; --accent-ink: #0d1a1c; --danger: #e07a68;
      --field: #151b22;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  }
  main { overflow-y: auto; padding: 28px 32px 48px; }
  aside {
    border-left: 1px solid var(--line); background: var(--surface);
    padding: 24px 22px; display: flex; flex-direction: column; gap: 16px;
    overflow-y: auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 0 0 18px; padding: 6px 18px 18px; }
  legend { font-weight: 650; padding: 0 8px; font-size: 15px; }
  label { display: block; margin-top: 14px; font-weight: 550; }
  .hint { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  input[type=text], input[type=password], input[type=number], textarea {
    width: 100%; margin-top: 6px; padding: 8px 10px; font: inherit; color: inherit;
    background: var(--field); border: 1px solid var(--line); border-radius: 6px;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 550; margin-top: 16px; }
  .check input { width: 16px; height: 16px; margin: 0; }
  button {
    font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .status { font-size: 17px; font-weight: 650; }
  .status small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  #qr { display: none; width: 100%; max-width: 260px; align-self: center; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--line); }
  #qr.visible { display: block; }
  .actions { display: grid; gap: 8px; }
  #log {
    flex: 1; min-height: 140px; margin: 0; padding: 10px; overflow-y: auto;
    background: var(--field); border: 1px solid var(--line); border-radius: 6px;
    font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #msg { min-height: 18px; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main>
  <h1>Bot WhatsApp</h1>
  <p class="sub">Il répond à ton numéro, dans le style que tu décris. Rien n'est envoyé à d'autres contacts.</p>

  <fieldset>
    <legend>Connexion</legend>
    <label>Clé API Google
      <span class="hint">À créer sur aistudio.google.com/apikey. Elle reste enregistrée sur cet ordinateur.</span>
      <input type="password" data-key="cleApi" autocomplete="off">
    </label>
    <label>Modèle Gemini
      <span class="hint">Change-le si Google en propose un plus récent.</span>
      <input type="text" data-key="modele">
    </label>
    <label>Numéros autorisés
      <span class="hint">Ton numéro, avec l'indicatif pays, sans + ni espaces (ex : 33612345678). Plusieurs numéros : sépare-les par une virgule.</span>
      <input type="text" data-key="numerosAutorises">
    </label>
  </fieldset>

  <fieldset>
    <legend>Personnage</legend>
    <div class="row">
      <label>Son prénom <input type="text" data-key="prenomElle"></label>
      <label>Ton prénom <input type="text" data-key="prenomMoi"></label>
    </div>
    <label>Votre relation <input type="text" data-key="relation"></label>
    <label>Façon d'écrire <textarea data-key="styleEcriture"></textarea></label>
    <label>Infos sur elle
      <span class="hint">Métier, goûts, habitudes, surnoms… tout ce qui aide à la rendre crédible.</span>
      <textarea data-key="infosSurElle"></textarea>
    </label>
    <label>Prompt personnalisé
      <span class="hint">Facultatif. S'il est rempli, il remplace la description ci-dessus.</span>
      <textarea data-key="promptPerso" style="min-height:110px"></textarea>
    </label>
    <label>Exemples de ses vrais messages
      <span class="hint">Un message par ligne. Prends son accord avant d'utiliser ses messages.</span>
      <textarea data-key="exemples" style="min-height:140px"></textarea>
    </label>
  </fieldset>

  <fieldset>
    <legend>Comportement</legend>
    <div class="row">
      <label>Délai min (s) <input type="number" min="0" data-key="delaiMin"></label>
      <label>Délai max (s) <input type="number" min="0" data-key="delaiMax"></label>
      <label>Attente fin de messages (s) <input type="number" min="0" data-key="attenteFin"></label>
    </div>
    <div class="row">
      <label>Frappe (ms par lettre) <input type="number" min="0" data-key="msParCaractere"></label>
      <label>Messages en mémoire <input type="number" min="2" data-key="memoire"></label>
    </div>
    <label class="check"><input type="checkbox" data-key="horairesActifs"> Répondre seulement à certaines heures</label>
    <div class="row">
      <label>De (heure) <input type="number" min="0" max="23" data-key="heureDebut"></label>
      <label>À (heure) <input type="number" min="0" max="24" data-key="heureFin"></label>
    </div>
  </fieldset>
</main>

<aside>
  <div class="status" id="status">Arrêté<small id="substatus">Enregistre puis démarre.</small></div>
  <img id="qr" alt="QR code à scanner avec le second numéro">
  <div class="actions">
    <button class="primary" id="btnStart">Enregistrer et démarrer</button>
    <button id="btnStop" disabled>Arrêter</button>
    <button id="btnSave">Enregistrer</button>
  </div>
  <div id="msg"></div>
  <pre id="log" aria-live="polite"></pre>
  <div class="actions">
    <button id="btnReset">Effacer la mémoire du bot</button>
    <button class="danger" id="btnLogout">Déconnecter WhatsApp</button>
  </div>
</aside>
<script src="renderer.js"></script>
</body>
</html>
